  :root{
    --abyss:#02101c; --deep:#062f4d; --mid:#0a5878;
    --foam:#eef9fc; --sea:#a9cfdf; --gold:#f2c879;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100dvh; display:grid; place-items:center; padding:28px 20px;
    font-family:Poppins,system-ui,sans-serif; color:var(--foam);
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(30,160,184,.45), transparent 60%),
      linear-gradient(180deg, var(--mid) 0%, var(--deep) 42%, var(--abyss) 100%);
    background-attachment:fixed; overflow-x:hidden;
  }
  .stage{width:100%;max-width:620px;text-align:center}
  .hide{display:none}

  /* ---------- countdown ---------- */
  .lead{font-family:Lora,Georgia,serif;font-style:italic;font-size:clamp(28px,7vw,44px);line-height:1.25;font-weight:500}
  .note{margin-top:14px;font-size:15px;font-weight:300;color:var(--sea)}
  .clock{display:flex;justify-content:center;gap:clamp(14px,5vw,40px)}
  .unit{min-width:clamp(66px,19vw,108px)}
  .num{font-size:clamp(46px,13vw,80px);font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
       color:var(--gold);text-shadow:0 0 34px rgba(242,200,121,.28)}
  .lbl{margin-top:10px;font-size:13px;letter-spacing:.04em;font-weight:300;color:var(--sea);opacity:.85}
  .when{font-size:14px;font-weight:300;color:var(--sea);opacity:.75}
  .when b{font-weight:500;color:var(--foam)}

  /* ---------- reveal ---------- */
  #reveal{animation:surface 1.5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes surface{from{opacity:0;transform:translateY(26px) scale(.985);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  .card{width:100%;border-radius:14px;display:block;box-shadow:0 30px 80px rgba(0,0,0,.55)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">

  <section id="wait">
    <div class="clock">
      <div class="unit"><div class="num" id="d">–</div><div class="lbl">dny</div></div>
      <div class="unit"><div class="num" id="h">–</div><div class="lbl">hodiny</div></div>
      <div class="unit"><div class="num" id="m">–</div><div class="lbl">minuty</div></div>
      <div class="unit"><div class="num" id="s">–</div><div class="lbl">sekundy</div></div>
    </div>

<script>
  // ---- kdy se pozvánka otevře (rok, měsíc-1, den, hodina, minuta) ----
  const TARGET = new Date(2026, 8, 16, 17, 0, 0);

  const wait = document.getElementById('wait');
  const reveal = document.getElementById('reveal');
  const pad = n => String(n).padStart(2, '0');

  function tick(){
    const left = TARGET - new Date();
    if (left <= 0){ wait.classList.add('hide'); reveal.classList.remove('hide'); clearInterval(timer); return; }
    const sec = Math.floor(left/1000);
    d.textContent = Math.floor(sec/86400);
    h.textContent = pad(Math.floor(sec/3600)%24);
    m.textContent = pad(Math.floor(sec/60)%60);
    s.textContent = pad(sec%60);
  }
  const timer = setInterval(tick, 1000); tick();

</script>
